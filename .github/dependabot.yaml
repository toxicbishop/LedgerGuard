version: 2
updates:
  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"

  # Maintain Go reconciliation engine dependencies
  - package-ecosystem: "gomod"
    directory: "/services/reconciliation-engine"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "go"

  # Maintain Python Policy RAG service dependencies
  - package-ecosystem: "pip"
    directory: "/services/policy-rag-service"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"

  # Maintain Python Dashboard dependencies
  - package-ecosystem: "pip"
    directory: "/services/dashboard"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"

  # Maintain Dockerfile base images
  - package-ecosystem: "docker"
    directory: "/services/reconciliation-engine"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/services/policy-rag-service"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/services/event-bridge"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/services/dashboard"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

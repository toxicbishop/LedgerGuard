name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: '3.11'}
      - run: pip install -r services/policy-rag-service/requirements.txt
      - run: PYTHONPATH=services/policy-rag-service pytest -q services/policy-rag-service/tests
      - uses: actions/setup-go@v5
        with: {go-version: '1.22'}
      - run: go test ./...
        working-directory: services/reconciliation-engine
